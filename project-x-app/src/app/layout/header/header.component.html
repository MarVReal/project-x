<mat-toolbar color="primary" class="app-header">
  <button mat-icon-button class="menu-toggle" (click)="menuToggle.emit()" aria-label="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>
  <div class="app-title-group">
    <span class="app-title">Task Management</span>
    <span class="app-context">Operations workspace</span>
  </div>
  <span class="spacer"></span>
  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Account menu">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="menu-header">
      <div class="menu-name">{{ displayName() }}</div>
      <div class="menu-role">{{ profile()?.role || 'Account' }}</div>
    </div>
    <button mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>My Profile</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
