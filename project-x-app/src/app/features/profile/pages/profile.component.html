<h1>My Profile</h1>

@if (profile(); as profile) {
  <mat-card appearance="outlined" class="profile-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="profile-form">
        <mat-form-field appearance="outline">
          <mat-label>Full name</mat-label>
          <input matInput formControlName="full_name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput [value]="profile.email" disabled />
        </mat-form-field>

        <div class="profile-meta">
          <mat-chip-set>
            <mat-chip>{{ profile.role }}</mat-chip>
            <mat-chip>{{ profile.status }}</mat-chip>
          </mat-chip-set>
        </div>

        @if (successMessage(); as message) {
          <p class="profile-success">{{ message }}</p>
        }
        @if (errorMessage(); as message) {
          <p class="profile-error" role="alert">{{ message }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
          Save changes
        </button>
      </form>
    </mat-card-content>
  </mat-card>
} @else {
  <p>Loading profile…</p>
}
